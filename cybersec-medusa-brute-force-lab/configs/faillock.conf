# ==============================================================================
# PAM FAILLOCK POLICY (/etc/security/faillock.conf)
# Mitigates Local & Network Brute-Force Across PAM-Aware Daemons (SSH, FTP, SMB)
# ==============================================================================
dir = /var/run/faillock
audit
silent
# Lock account after 3 consecutive failed authentication attempts
deny = 3
# Window of time (15 minutes) in which failed attempts are counted
fail_interval = 900
# Lockout duration in seconds (15 minutes = 900s)
unlock_time = 900
# Also protect the root account from brute-force attempts
even_deny_root
root_unlock_time = 900
