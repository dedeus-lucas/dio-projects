# ==============================================================================
# HARDENED VSFTPD BASELINE (DEBIAN 12 - srv-linux-base)
# Mitigates Medusa ftp.mod Multi-Threaded Socket Concurrency
# ==============================================================================
listen=YES
listen_ipv6=NO
listen_address=192.168.56.10

# 1. Disable Anonymous Access & Enforce Local PAM Authentication
anonymous_enable=NO
local_enable=YES
write_enable=NO
pam_service_name=vsftpd

# 2. Anti-Brute-Force Rate Limiting & Thread Throttling
# Inserts a mandatory 5-second delay on failed PASS and caps concurrent sockets per IP
delay_failed_login=5
max_login_fails=3
max_per_ip=2
max_clients=10

# 3. Chroot Isolation & Audit Logging
chroot_local_user=YES
allow_writeable_chroot=NO
xferlog_enable=YES
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
