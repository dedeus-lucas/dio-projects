# ==============================================================================
# HARDENED SAMBA BASELINE (DEBIAN 12 - srv-linux-base)
# Mitigates SMB Enumeration, Null Sessions, and Parallel Password Spraying
# ==============================================================================
[global]
   workgroup = WORKGROUP
   server string = Hardened Debian Server
   interfaces = 127.0.0.1/8 192.168.56.10/24
   bind interfaces only = yes

   # 1. Protocol & Cryptographic Hardening (Blocks SMBv1/SMBv2 downgrade)
   server min protocol = SMB3
   smb encrypt = required
   server signing = mandatory
   ntlm auth = disabled

   # 2. Anti-Enumeration & Null-Session Lockdown (Blocks rpcclient / enum4linux)
   map to guest = Never
   restrict anonymous = 2
   usershare allow guests = no

   # 3. PAM Integration & Audit Telemetry (Enforces pam_faillock & Fail2Ban)
   obey pam restrictions = yes
   pam password change = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   log level = 1 auth_audit:3

[secure_ops]
   path = /srv/samba/secure_ops
   browsable = no
   read only = no
   guest ok = no
   valid users = @smb_auditors
